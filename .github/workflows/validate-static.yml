name: Validar RN nas Urnas 2022

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxe JavaScript
        run: node --check app.js && node --check rn2022-core.js && node --check achados.js && python -m py_compile scripts/build_achados_2026.py
      - name: Verificar associação TSE/IBGE
        run: |
          python - <<'PY'
          import json,re,unicodedata
          d=json.load(open("data/eleicoes-2022.json",encoding="utf-8"))
          g=json.load(open("data/rn-municipios.geojson",encoding="utf-8"))
          m=json.load(open("data/mesorregioes.json",encoding="utf-8"))
          aliases={"ACU":"ASSU","ARES":"AREZ","JANUARIO CICCO":"BOA SAUDE"}
          def norm(s):
              raw="".join(c for c in unicodedata.normalize("NFD",s or "") if unicodedata.category(c)!="Mn").upper()
              raw=re.sub(r"[^A-Z0-9]+"," ",raw).strip()
              raw=re.sub(r"\s+"," ",raw)
              return aliases.get(raw,raw)
          assert len(d["municipios"])==167
          assert len(g["features"])==167
          keys={norm(k):k for k in d["municipios"]}
          missing=[f["properties"]["nome"] for f in g["features"] if norm(f["properties"]["nome"]) not in keys]
          assert not missing, missing
          mesos={k:{norm(x) for x in v} for k,v in m.items()}
          issues=[k for k in d["municipios"] if sum(norm(k) in s for s in mesos.values())!=1]
          assert not issues, issues
          assert keys[norm("Açu")]=="ASSÚ"
          senate_party_missing=[k for k,v in d["partidos"].items() if "Senador" not in v.get("1",{})]
          assert not senate_party_missing, ("Partidos · Senado ausente", senate_party_missing[:10])
          assert open("rn2022-core.js",encoding="utf-8").read().startswith("window.__rn2022Booted=true;")
          assert json.load(open("rn2022-results.json",encoding="utf-8"))["meta"]["ano"]==2022
          assert len(json.load(open("rn2022-map.json",encoding="utf-8"))["features"])==167
          a=json.load(open("data/achados-2026.json",encoding="utf-8"))
          assert a["status"] in {"waiting","live","final"}
          assert isinstance(a.get("offices",{}),dict)
          assert isinstance(a.get("municipal_pres",{}),dict)
          if a.get("evolution") is not None:
              assert isinstance(a["evolution"],dict)
              for office in ("pres","gov","sen"):
                  assert isinstance(a["evolution"].get(office,[]),list)
          assert open("index.html",encoding="utf-8").read().find("Achados 2026")>=0
          assert open("arquivo-2022.html",encoding="utf-8").read().find("RN NAS URNAS")>=0
          print("OK: 167 municípios associados entre mapa, TSE e mesorregiões")
          PY
