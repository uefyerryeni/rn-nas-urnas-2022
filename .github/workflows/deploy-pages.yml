name: Deploy RN nas Urnas 2022
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar base oficial TSE 2022
        run: python scripts/build_data.py
      - name: Homologação
        run: |
          test -s index.html
          test -s style.css
          test -s app.js
          test -s data/eleicoes-2022.json
          grep -q "RN nas Urnas" index.html
          python - <<'PY'
          import json
          d=json.load(open('data/eleicoes-2022.json'))
          assert d['meta']['ano']==2022
          assert len(d['municipios'])==167
          assert 'NATAL' in d['municipios']
          assert d['zonasNatal']
          print('Base homologada:',len(d['municipios']),'municípios;',len(d['zonasNatal']),'zonas de Natal')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

