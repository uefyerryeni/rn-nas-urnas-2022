name: Deploy RN nas Urnas 2022
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  homologacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Homologação automatizada
        run: |
          test -s index.html
          test -s style.css
          test -s app.js
          test -s data/resumo-rn.json
          grep -q "RN nas Urnas" index.html
          grep -q "TSE" index.html
          python -m json.tool data/resumo-rn.json >/dev/null
          echo "Homologação concluída."
  deploy:
    needs: homologacao
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4